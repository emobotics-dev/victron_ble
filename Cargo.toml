[package]
name = "victron_ble"
version = "0.6.0"
edition = "2021"
repository = "https://github.com/felixwatts/victron_ble"
description = "Read data from Victron devices over Bluetooth Low Energy."
license = "MIT"
readme = "README.md"
keywords = ["Victron", "BLE", "bluetooth"]
exclude = ["docs"]

[dependencies]
aes = { version = "0.8.4", default-features = false, optional = true }
thiserror = { version = "2.0.16", default-features = false }
num_enum = { version = "0.7.4", default-features = false }
strum = { version = "0.27.2", default-features = false, features = ["derive"] }
serde = { version = "1.0.225", optional = true, features = ["derive"]}
bitflags = { version = "2.9.3", default-features = false }
tokio = { version =  "1.47.1", features = ["rt", "rt-multi-thread", "macros"], optional = true }
tokio-stream = { version = "0.1.17", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", features=["bluetoothd"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
bluest = { version = "0.6.9", optional = true }

[dev-dependencies]
hex = "0.4"
# The reference cipher the decryption test builds its fixture with.
aes = { version = "0.8.4", default-features = false }
ctr = { version = "0.9.2", default-features = false }

[features]
default = ["bluetooth", "all-devices", "soft-aes"]
# Device types compile per feature: the decrypted 16 bytes are a DIFFERENT
# bitfield per record type, so every supported type carries its own decoder,
# and the type byte is runtime data -- nothing can be dropped by LTO. A host
# that reads one kind of device should not pay for six (4.8 KiB on xtensa).
all-devices = [
    "battery-monitor",
    "ac-charger",
    "solar-charger",
    "inverter",
    "ve-bus",
    "test-record",
]
# The software cipher. A host with an AES accelerator turns this off and
# passes its own `Aes128Encrypt`, which is ~3.6 KiB of xtensa code less and no
# key schedule per message.
soft-aes = ["dep:aes"]
battery-monitor = []
ac-charger = []
solar-charger = []
inverter = []
ve-bus = []
test-record = []
serde = ["dep:serde", "bitflags/serde"]
bluetooth = ["dep:bluer", "dep:bluest", "dep:tokio", "dep:tokio-stream"]
